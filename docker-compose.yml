services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reconx
      POSTGRES_PASSWORD: reconx
      POSTGRES_DB: reconx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "reconx"]
      interval: 2s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://reconx:reconx@db:5432/reconx
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data/generated:/app/data/generated  # generated CSVs appear on your computer
    depends_on:
      db:
        condition: service_healthy  # wait until Postgres accepts connections

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
